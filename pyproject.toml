[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-pipeline"
version = "1.0.0"
description = "A tested retail data pipeline with local and Azure/PySpark implementations."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
spark = ["pyspark>=3.5"]

[project.scripts]
retailpulse = "retailpulse.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

